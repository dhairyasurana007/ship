          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK + CLI
        run: pnpm build:sdk && pnpm build:cli
      - name: TTFE drill
        run: pnpm drill ttfe
        timeout-minutes: 2
      - name: TTFE elapsed check
        run: |
          if [ -f test-results/ttfe-timing.json ]; then
            TOTAL=$(node -e "const d=require('./test-results/ttfe-timing.json');console.log(d.reduce((a,x)=>a+x.elapsedMs,0))")
            [ "$TOTAL" -lt 60000 ] || (echo "TTFE exceeded 60s: ${TOTAL}ms" && exit 1)
          fi

