name: SDK

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main, master, mvp]
  pull_request:
    branches: [main, master, mvp]

permissions:
  contents: read

jobs:
  api-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_dev_password
          POSTGRES_DB: ship_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ship -d ship_dev"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ship:ship_dev_password@127.0.0.1:5432/ship_dev
      NODE_ENV: test
      SESSION_SECRET: test-session-secret
      CORS_ORIGIN: http://localhost:5173
      CI: true
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: corepack pnpm build:shared
      - name: Build API
        run: corepack pnpm build:api
      - name: Run migrations
        run: corepack pnpm -C api db:migrate
      - name: Seed baseline data
        run: corepack pnpm db:seed
      - name: Lint — API boundary enforcement
        run: pnpm lint
      - name: API quality suites
        run: >
          corepack pnpm -C api exec vitest run
          src/platform/apps/__tests__/appsRouter.test.ts
          src/platform/apps/__tests__/OAuthAppService.test.ts
          src/platform/middleware/__tests__/bearerAuth.test.ts
          src/platform/middleware/__tests__/requireScope.test.ts
          src/platform/__tests__/api-contract.fitness.test.ts
          src/platform/__tests__/openapi.test.ts
          src/routes/auth.test.ts
          src/routes/documents.test.ts

  refresh-token-rotation:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Refresh token rotation unit tests
        run: pnpm -C api exec vitest run src/platform/oauth/refresh.test.ts

  stolen-token-drill:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI: true
      API_URL: https://ship-api-ysxi.onrender.com
      TEST_REFRESH_TOKEN: ${{ secrets.TEST_REFRESH_TOKEN }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stolen token drill
        run: pnpm --filter @ship/cli exec vitest run tests/stolen-token.drill.ts

  webhook-pipeline:
    runs-on: ubuntu-latest
    needs: [refresh-token-rotation]
    env:
      NODE_ENV: test
      CI: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Webhook pipeline unit tests
        run: pnpm -C api exec vitest run src/platform/webhooks/__tests__/HmacSigner.test.ts

  architecture-doc:
    runs-on: ubuntu-latest
    needs: []
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Architecture doc check
        run: |
          [ -f docs/architecture.md ] || (echo "missing docs/architecture.md" && exit 1)
          COUNT=$(grep -c "^##" docs/architecture.md)
          [ "$COUNT" -ge 9 ] || (echo "only $COUNT sections, need >= 9" && exit 1)
          echo "Architecture doc OK: $COUNT sections"

