name: FleetGraph MVP Acceptance

on:
  workflow_dispatch:
  push:
    branches: [mvp, master]

jobs:
  fleetgraph-mvp-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_dev_password
          POSTGRES_DB: ship_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ship -d ship_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ship:ship_dev_password@127.0.0.1:5432/ship_dev
      NODE_ENV: test
      SESSION_SECRET: test-session-secret
      CORS_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: corepack pnpm build:shared
      - name: Run DB migrations
        run: corepack pnpm -C api db:migrate
      - name: Run FleetGraph API tests
        run: corepack pnpm -C api exec vitest run src/__tests__/fleetgraph-config.test.ts src/__tests__/fleetgraph-dedup-worsening.test.ts src/__tests__/fleetgraph-human-gate.test.ts src/__tests__/fleetgraph-migration.test.ts src/__tests__/fleetgraph-notifications.test.ts src/__tests__/fleetgraph-observability.test.ts src/__tests__/fleetgraph-on-demand-context.test.ts src/__tests__/fleetgraph-proactive-classification.test.ts src/__tests__/fleetgraph-trigger-queue.test.ts src/__tests__/fleetgraph-trigger-runtime.test.ts
      - name: Run FleetGraph web tests
        run: corepack pnpm -C web exec vitest run src/components/fleetgraph/FleetGraphAssistantPanel.test.tsx
