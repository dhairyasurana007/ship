name: Security Probe

on:
  pull_request:
    paths:
      - "security-probe/**"
      - ".github/workflows/security-probe.yml"
  push:
    paths:
      - "security-probe/**"
      - ".github/workflows/security-probe.yml"

jobs:
  security-probe-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: security-probe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: security-probe/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  security-probe-scaffold:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: security-probe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: security-probe/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: CLI smoke run
        run: npx tsx ./index.ts https://ship-web-ak37.onrender.com --output ./reports-ci

      - name: Non-existent URL smoke run
        run: |
          if npx tsx ./index.ts https://example.test --output ./reports-ci-nonexistent; then
            echo "Expected unreachable URL run to fail, but it succeeded"
            exit 1
          fi

      - name: Assert reports exist and JSON is valid
        run: |
          test -f ./reports-ci/security-probe-report.json
          test -f ./reports-ci/security-probe-report.md
          node -e "JSON.parse(require('fs').readFileSync('./reports-ci/security-probe-report.json','utf8')); console.log('json valid')"
