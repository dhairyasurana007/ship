name: Security Probe

on:
  pull_request:
    paths:
      - "security-probe/**"
      - ".github/workflows/security-probe.yml"
  push:
    paths:
      - "security-probe/**"
      - ".github/workflows/security-probe.yml"

jobs:
  install-security-probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: security-probe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: security-probe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Package installed dependencies
        run: tar -czf security-probe-deps.tgz node_modules package-lock.json

      - name: Upload dependency bundle
        uses: actions/upload-artifact@v4
        with:
          name: security-probe-deps
          path: security-probe/security-probe-deps.tgz
          if-no-files-found: error

  security-probe:
    runs-on: ubuntu-latest
    needs: install-security-probe
    defaults:
      run:
        shell: bash
        working-directory: security-probe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: security-probe/package-lock.json

      - name: Download dependency bundle
        uses: actions/download-artifact@v4
        with:
          name: security-probe-deps
          path: security-probe

      - name: Restore dependencies
        run: tar -xzf security-probe-deps.tgz

      - name: Run security probe
        run: npx tsx ./index.ts https://ship-web-ak37.onrender.com --output ./reports-ci

      - name: Non-existent URL smoke run
        run: |
          if npx tsx ./index.ts https://example.test --output ./reports-ci-nonexistent; then
            echo "Expected unreachable URL run to fail, but it succeeded"
            exit 1
          fi

      - name: Assert reports exist and JSON is valid
        run: |
          test -f ./reports-ci/security-probe-report.json
          test -f ./reports-ci/security-probe-report.md
          node -e "JSON.parse(require('fs').readFileSync('./reports-ci/security-probe-report.json','utf8')); console.log('json valid')"
