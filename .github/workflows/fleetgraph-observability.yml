name: SDK - FleetGraph Observability

on:
  push:
    branches: [mvp, master]
    paths:
      - ".github/workflows/fleetgraph-observability.yml"
      - "api/src/fleetgraph/**"
      - "api/src/__tests__/fleetgraph-observability.test.ts"
      - "api/package.json"
      - "pnpm-lock.yaml"
      - "package.json"
  pull_request:
    paths:
      - ".github/workflows/fleetgraph-observability.yml"
      - "api/src/fleetgraph/**"
      - "api/src/__tests__/fleetgraph-observability.test.ts"
      - "api/package.json"
      - "pnpm-lock.yaml"
      - "package.json"

jobs:
  api-fleetgraph-observability-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run observability tests
        run: corepack pnpm -C api exec vitest run src/__tests__/fleetgraph-observability.test.ts src/__tests__/fleetgraph-langsmith.test.ts
