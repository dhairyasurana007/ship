name: PlugForge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main, master, mvp]
    paths:
      - ".github/workflows/plugforge.yml"
      - "api/**"
      - "sdk/**"
      - "integrations/cli/**"
      - "e2e/**"
      - "perform-audit.cjs"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main, master, mvp]
    paths:
      - ".github/workflows/plugforge.yml"
      - "api/**"
      - "sdk/**"
      - "integrations/cli/**"
      - "e2e/**"
      - "perform-audit.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  api-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_dev_password
          POSTGRES_DB: ship_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ship -d ship_dev"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ship:ship_dev_password@127.0.0.1:5432/ship_dev
      NODE_ENV: test
      SESSION_SECRET: test-session-secret
      CORS_ORIGIN: http://localhost:5173
      CI: true
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: corepack pnpm build:shared
      - name: Build API
        run: corepack pnpm build:api
      - name: Run migrations
        run: corepack pnpm -C api db:migrate
      - name: Seed baseline data
        run: corepack pnpm db:seed
      - name: API quality suites
        run: >
          corepack pnpm -C api exec vitest run
          src/platform/apps/__tests__/appsRouter.test.ts
          src/platform/apps/__tests__/OAuthAppService.test.ts
          src/platform/middleware/__tests__/bearerAuth.test.ts
          src/platform/middleware/__tests__/requireScope.test.ts
          src/platform/__tests__/api-contract.fitness.test.ts
          src/platform/__tests__/openapi.test.ts
          src/routes/auth.test.ts
          src/routes/documents.test.ts

  f3-refresh-token-rotation:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Refresh token rotation unit tests
        run: pnpm -C api exec vitest run src/platform/oauth/refresh.test.ts

  f4-webhook-pipeline:
    runs-on: ubuntu-latest
    needs: [f3-refresh-token-rotation]
    env:
      NODE_ENV: test
      CI: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Webhook pipeline unit tests
        run: pnpm -C api exec vitest run src/platform/webhooks/__tests__/HmacSigner.test.ts

  f6-ratelimit-audit:
    runs-on: ubuntu-latest
    needs: [f5-retry-dlq-replay]
    env:
      NODE_ENV: test
      CI: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Rate limit + audit unit tests
        run: pnpm -C api exec vitest run src/platform/ratelimit/ratelimit.test.ts

  f5-retry-dlq-replay:
    runs-on: ubuntu-latest
    needs: [f4-webhook-pipeline]
    env:
      NODE_ENV: test
      CI: true
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Retry + DLQ unit tests
        run: pnpm -C api exec vitest run src/platform/webhooks/retry.test.ts
        timeout-minutes: 1

  sdk-cli:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK
        run: corepack pnpm build:sdk
      - name: Build CLI
        run: corepack pnpm build:cli
      - name: CLI lint
        run: corepack pnpm lint integrations/cli
      - name: SDK smoke suites
        run: >
          corepack pnpm -C sdk exec vitest run
          src/auth/__tests__/DeviceFlow.test.ts
          src/__tests__/ShipClient.integration.test.ts

  playwright-regression:
    runs-on: ubuntu-latest
    env:
      CI: true
      PLAYWRIGHT_WORKERS: 2
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright regression suite
        run: pnpm test:e2e

  live-smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      API_URL: https://ship-api-ysxi.onrender.com
      WEB_URL: https://ship-web-ak37.onrender.com
      CI: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK
        run: corepack pnpm build:sdk
      - name: Build CLI
        run: corepack pnpm build:cli
      - name: Check public discovery endpoints
        run: |
          set -euo pipefail
          curl -fsS "$API_URL/.well-known/ship.json" | node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(0,'utf8')); if (!data.oauth_client_id) throw new Error('Missing oauth_client_id');"
          curl -fsS "$API_URL/api/v1/openapi.json" | node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(0,'utf8')); if (data.openapi !== '3.1.0') throw new Error('Unexpected OpenAPI version');"
      - name: End-to-end CLI login
        run: |
          set -euo pipefail
          out="$(mktemp)"
          err="$(mktemp)"
          node integrations/cli/dist/index.js login >"$out" 2>"$err" &
          pid=$!

          for _ in $(seq 1 30); do
            if grep -q '^Visit ' "$out"; then
              break
            fi
            sleep 1
          done

          cat "$out"
          cat "$err" >&2

          if ! grep -q '^Visit ' "$out"; then
            echo "ship login did not print a verification URL" >&2
            kill "$pid" || true
            wait "$pid" || true
            exit 1
          fi

          verification_uri="$(sed -n 's/^Visit \(.*\) and enter .*$/\1/p' "$out" | tail -n1)"
          user_code="$(sed -n 's/^Visit .* and enter \(.*\)$/\1/p' "$out" | tail -n1)"

          curl -fsS -X POST "$verification_uri/verify" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data "user_code=$user_code&email=dev%40ship.local&password=admin123" >/dev/null

          wait "$pid"
          cat "$out"
          if ! grep -q '^Logged in as ' "$out"; then
            echo "ship login did not finish successfully" >&2
            exit 1
          fi

          node integrations/cli/dist/index.js docs ls >/tmp/ship-docs.out
          test -s /tmp/ship-docs.out

  audit-baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    env:
      AUDIT_API_URL: https://ship-api-ysxi.onrender.com
      AUDIT_WEB_URL: https://ship-web-ak37.onrender.com
      AUDIT_EMAIL: dev@ship.local
      AUDIT_PASSWORD: admin123
      DATABASE_URL: ${{ secrets.SHIP_AUDIT_DATABASE_URL }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run performance and query audit
        run: node perform-audit.cjs --categories=2,3,4
