name: FleetGraph Evals

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  fleetgraph-api-evals:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_dev_password
          POSTGRES_DB: ship_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ship -d ship_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ship:ship_dev_password@127.0.0.1:5432/ship_dev
      NODE_ENV: test
      SESSION_SECRET: test-session-secret
      CORS_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: corepack pnpm build:shared
      - name: Build SDK
        run: corepack pnpm build:sdk
      - name: Run DB migrations
        run: corepack pnpm -C api db:migrate
      - name: Run FleetGraph API eval suite
        run: >
          corepack pnpm -C api exec vitest run
          src/__tests__/fleetgraph-config.test.ts
          src/__tests__/fleetgraph-dedup-worsening.test.ts
          src/__tests__/fleetgraph-human-gate.test.ts
          src/__tests__/fleetgraph-langsmith.test.ts
          src/__tests__/fleetgraph-migration.test.ts
          src/__tests__/fleetgraph-notifications.test.ts
          src/__tests__/fleetgraph-observability.test.ts
          src/__tests__/fleetgraph-on-demand-context.test.ts
          src/__tests__/fleetgraph-proactive-classification.test.ts
          src/__tests__/fleetgraph-search-planner.test.ts
          src/__tests__/fleetgraph-search-routing.test.ts
          src/__tests__/fleetgraph-tool-matrix-routing.test.ts
          src/__tests__/fleetgraph-tools-intent.test.ts
          src/__tests__/fleetgraph-trigger-queue.test.ts
          src/__tests__/fleetgraph-trigger-runtime.test.ts

  fleetgraph-web-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: corepack pnpm build:shared
      - name: Run FleetGraph web eval suite
        run: >
          corepack pnpm -C web exec vitest run
          src/components/fleetgraph/FleetGraphAssistantPanel.test.tsx
          src/components/fleetgraph/FleetGraphGlobalLauncher.test.tsx

  fleetgraph-playwright-evals:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_dev_password
          POSTGRES_DB: ship_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ship -d ship_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NODE_ENV: test
      SESSION_SECRET: test-session-secret
      DATABASE_URL: postgres://ship:ship_dev_password@127.0.0.1:5432/ship_dev
      CORS_ORIGIN: http://127.0.0.1:4173
      FLEETGRAPH_MODEL: gpt-4o-mini
      PLAYWRIGHT_WORKERS: 1
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API
        run: pnpm build:api
      - name: Build web app
        run: pnpm build:web
      - name: Run DB migrations
        run: pnpm db:migrate
      - name: Seed baseline data
        run: pnpm db:seed
      - name: Start API server
        run: nohup pnpm --filter @ship-dhairya/api start >/tmp/ship-api.log 2>&1 &
      - name: Start web preview
        run: nohup pnpm --filter @ship-dhairya/web preview --host 127.0.0.1 >/tmp/ship-web.log 2>&1 &
      - name: Wait for local stack
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173 >/dev/null && curl -sf http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API log:"
          cat /tmp/ship-api.log || true
          echo "Web log:"
          cat /tmp/ship-web.log || true
          exit 1
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run FleetGraph Playwright eval suite
        run: >
          pnpm exec playwright test
          e2e/fleetgraph-proactive-notifications.spec.ts
          e2e/fleetgraph-human-gate.spec.ts
          e2e/fleetgraph-ondemand-context.spec.ts
      # Playwright evals use a local CI stack and leave test-tagged rows behind.
      # This step removes them so repeated runs start from a clean state.
      - name: Cleanup eval test data
        if: always()
        run: bash scripts/fleetgraph-eval-cleanup.sh
